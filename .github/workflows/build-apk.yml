
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check project structure
        run: |
          echo "Checking JARVIS project..."
          pwd
          ls -la
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Project files found."

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/jarvis-build.log"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Save build log if failed
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-build-error-log
          path: ${{ runner.temp }}/jarvis-build.log
          if-no-files-found: ignore
          retention-days: 7
          
